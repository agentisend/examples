name: examples

on:
  push:
  pull_request:

# Each example runs against the in-repo fake. TRANSPORT=fake is the same
# contract as the monorepo: nothing is delivered.
jobs:
  fake-transport:
    runs-on: ubuntu-latest
    env:
      TRANSPORT: fake
      AGENTISEND_API_KEY: as_fake_examples
      MAIL_FROM: notifications@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y php-cli ruby elixir
      - run: npm install
      - run: python3 -m pip install -r requirements.txt -r requirements-agents.txt
      - run: npm run ci
